name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Lua syntax
        run: |
          sudo apt-get install -y -qq lua5.4 > /dev/null
          for f in $(git ls-files '*.lua'); do luac5.4 -p "$f"; done

      - name: Check version
        run: |
          v=$(tr -d '[:space:]' < version.txt)
          grep -q "version '$v'" fxmanifest.lua || { echo "fxmanifest version does not match version.txt ($v)"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then echo "tag $GITHUB_REF_NAME does not match version.txt ($v)"; exit 1; fi

      - name: Package
        run: |
          mkdir -p dist/logic-whip
          cp -r fxmanifest.lua README.md LICENSE CHANGELOG.md client server shared html stream dist/logic-whip/
          cd dist && zip -qr logic-whip.zip logic-whip

      - uses: actions/upload-artifact@v4
        with:
          name: logic-whip
          path: dist/logic-whip.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/logic-whip.zip --title "logic-whip $GITHUB_REF_NAME" --notes-file notes.md
